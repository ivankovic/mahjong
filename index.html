<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turtle Mahjong</title>
<meta name="description" content="Mahjong solitaire on the classic 144-tile turtle layout, with dog, chameleon, coral reef and Halloween tile sets. Every deal can be cleared.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 53'%3E%3Crect x='1' y='1' width='38' height='51' rx='6' fill='%231c7455'/%3E%3Crect x='1' y='1' width='34' height='47' rx='6' fill='%23f8f4e8'/%3E%3Ctext x='18' y='26' text-anchor='middle' dominant-baseline='central' font-family='serif' font-weight='900' font-size='30' fill='%23c2291e'%3E%E4%B8%AD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Fredoka:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Shippori+Mincho+B1:wght@700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&display=swap&text=一二三四五六七八九萬東南西北中發梅蘭菊竹春夏秋冬龜">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">
      <div class="seal" aria-hidden="true">龜</div>
      <div>
        <h1 data-i18n="title">Turtle Mahjong</h1>
        <p class="deal" id="deal">Deal</p>
      </div>
    </div>
    <dl class="stats">
      <div><dt data-i18n="tilesLeft">Tiles left</dt><dd id="left">144</dd></div>
      <div><dt data-i18n="openPairs">Open pairs</dt><dd id="pairs">0</dd></div>
      <div><dt data-i18n="time">Time</dt><dd id="time">0:00</dd></div>
    </dl>
    <div class="actions">
      <button class="btn" id="hintBtn" type="button"><span data-i18n="hint">Hint</span><kbd>H</kbd></button>
      <button class="btn" id="undoBtn" type="button"><span data-i18n="undo">Undo</span><kbd>U</kbd></button>
      <button class="btn" id="shuffleBtn" type="button"><span data-i18n="shuffle">Shuffle</span><kbd>S</kbd></button>
      <button class="btn" id="restartBtn" type="button" data-i18n="restart">Restart</button>
      <button class="btn primary" id="newBtn" type="button" data-i18n="newDeal">New deal</button>
      <label class="toggle"><input type="checkbox" id="shade" checked> <span data-i18n="shade">Shade blocked tiles</span></label>
      <div class="langs" id="langs" role="radiogroup" aria-label="Language"></div>
    </div>
  </header>

  <div class="skins" id="skins" role="radiogroup" aria-label="Tile style"></div>

  <main class="board-wrap" id="wrap">
    <div class="board shade-on" id="board" aria-label="Mahjong solitaire board"></div>
    <div class="party" id="party" aria-hidden="true"></div>
    <div class="toast" id="toast" role="status" hidden></div>
    <button class="help-btn" id="helpBtn" type="button" aria-label="How to play" title="How to play">?</button>
    <div class="notice" id="help" hidden>
      <div class="card help" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
        <h2 id="helpTitle" data-i18n="howTo">How to play</h2>
        <div id="helpBody"></div>
        <div class="row"><button class="btn primary" id="helpClose" type="button" data-i18n="gotIt">Got it</button></div>
      </div>
    </div>
    <div class="notice" id="notice" hidden>
      <div class="card" role="dialog" aria-live="polite">
        <h2 id="nTitle"></h2>
        <p id="nBody"></p>
        <div class="row" id="nActions"></div>
      </div>
    </div>
  </main>

</div>


<script src="src/i18n.js"></script>
<script src="src/game.js"></script>
</body>
</html>
