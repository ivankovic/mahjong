version = 1
SPDX-PackageName = "mahjong"
SPDX-PackageSupplier = "Marko Ivankovic <marko@ivankovic.me>"
SPDX-PackageDownloadLocation = "https://github.com/ivankovic/mahjong"

# Code: AGPL-3.0-or-later. src/*.js and src/*.css carry their own SPDX
# headers; the files below have none, either because a licence line at the
# top would be noise to the people the file is for (README) or because they
# are the page and the tooling around the program rather than art.
[[annotations]]
path = [
  "index.html",
  "README.md",
  ".github/**",
  ".gitignore",
  "package.json",
  "package-lock.json",
]
SPDX-FileCopyrightText = "2026 Marko Ivankovic"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Art is licensed separately from code. Everything under assets/ is art,
# including assets/src/build.mjs: it is code only in the sense that the
# drawings are written in it. It and the sprites it writes carry their own
# headers; this rule covers themes.json and anything else without one.
[[annotations]]
path = "assets/**"
SPDX-FileCopyrightText = "2026 Marko Ivankovic"
SPDX-License-Identifier = "CC-BY-NC-ND-4.0"

# The fonts (IBM Plex Sans, Shippori Mincho B1, Noto Serif TC, Fredoka and
# Creepster, all OFL-1.1)
# are loaded from Google Fonts at runtime and not shipped in this repository,
# so they need no entry here.

# The README's GIF is a picture of the art, so it is licensed as art.
[[annotations]]
path = "docs/themes.gif"
SPDX-FileCopyrightText = "2026 Marko Ivankovic"
SPDX-License-Identifier = "CC-BY-NC-ND-4.0"
